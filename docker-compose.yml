services:
  ui-prototype-manager:
    build: .
    container_name: ui-prototype-manager
    ports:
      - "127.0.0.1:${UIPM_HOST_PORT:-8081}:8080"
    environment:
      UIPM_DATA_DIR: /data
      UIPM_ACCESS_KEY: ${UIPM_ACCESS_KEY:?Set UIPM_ACCESS_KEY in .env}
      UIPM_COOKIE_SECURE: ${UIPM_COOKIE_SECURE:-false}
      UIPM_S3_BUCKET: ${UIPM_S3_BUCKET:-}
      UIPM_S3_PROVIDER: ${UIPM_S3_PROVIDER:-s3}
      UIPM_S3_ENDPOINT_URL: ${UIPM_S3_ENDPOINT_URL:-}
      UIPM_S3_BROWSER_ENDPOINT_URL: ${UIPM_S3_BROWSER_ENDPOINT_URL:-}
      UIPM_OSS_CNAME: ${UIPM_OSS_CNAME:-}
      UIPM_S3_REGION: ${UIPM_S3_REGION:-us-east-1}
      UIPM_S3_ACCESS_KEY_ID: ${UIPM_S3_ACCESS_KEY_ID:-}
      UIPM_S3_SECRET_ACCESS_KEY: ${UIPM_S3_SECRET_ACCESS_KEY:-}
      UIPM_S3_PREFIX: ${UIPM_S3_PREFIX:-uipm}
      UIPM_S3_ADDRESSING_STYLE: ${UIPM_S3_ADDRESSING_STYLE:-auto}
      UIPM_S3_SIGNATURE_VERSION: ${UIPM_S3_SIGNATURE_VERSION:-s3v4}
      UIPM_S3_DIRECT_READ: ${UIPM_S3_DIRECT_READ:-true}
      UIPM_S3_PRESIGN_TTL_SECONDS: ${UIPM_S3_PRESIGN_TTL_SECONDS:-3600}
    volumes:
      - "${UIPM_HOST_DATA_DIR:-./data}:/data"
    restart: unless-stopped
