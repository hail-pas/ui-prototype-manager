<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · UI Prototype Manager</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="login-body">
  <main class="login-card">
    <div class="eyebrow">UI PROTOTYPE MANAGER</div>
    <h1>密钥登录</h1>
    <p>输入访问密钥后可使用全部页面。验证成功后浏览器保持登录 1 天。</p>
    <form id="loginForm">
      <label>访问密钥<input id="keyInput" type="password" autocomplete="current-password" autofocus /></label>
      <div id="loginError" class="login-error" aria-live="polite"></div>
      <button class="primary-btn login-submit" type="submit">验证并进入</button>
    </form>
  </main>
  <script>
    const form=document.getElementById('loginForm');
    const input=document.getElementById('keyInput');
    const error=document.getElementById('loginError');
    form.addEventListener('submit',async e=>{
      e.preventDefault(); error.textContent='';
      const key=input.value; if(!key){error.textContent='请输入密钥';return;}
      const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
      if(!res.ok){let msg='密钥错误';try{msg=(await res.json()).detail||msg}catch{} error.textContent=msg; input.select(); return;}
      const next=new URLSearchParams(location.search).get('next');
      location.href=next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
    });
  </script>
</body>
</html>
