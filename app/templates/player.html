<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ project.name }} · Preview</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="player-body">
  <div id="player" data-project-id="{{ project.id }}" class="player-shell">
    <header class="player-topbar">
      <div class="player-topbar-left"><button id="navToggle" class="ghost-btn player-nav-toggle" type="button" aria-expanded="true">☰ 页面</button><button id="backBtn" class="ghost-btn">← 返回</button></div>
      <div class="player-title"><strong>{{ project.name }}</strong><span id="playerPageName"></span></div>
      <div class="player-topbar-left"><a href="/project/{{ project.id }}" class="ghost-btn">退出预览</a><a href="/logout" class="ghost-btn">退出登录</a></div>
    </header>
    <div class="player-content">
      <aside id="playerNav" class="player-nav" aria-label="页面导航"><div class="player-nav-heading">全部页面 <span id="playerPageCount" class="count-pill">0</span></div><div id="playerPageList" class="player-page-list"></div></aside>
      <main id="playerStage" class="player-stage"></main>
    </div>
  </div>
  <script src="/static/frame-fit.js"></script>
  <script src="/static/player.js"></script>
</body>
</html>
