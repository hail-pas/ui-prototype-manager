<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ project.name }} · Preview</title>
  <link rel="stylesheet" href="/static/app.css?v=20260831-external-link" />
  <link rel="stylesheet" href="/static/media-pages.css?v=20260906-video-pages" />
</head>
<body class="player-body">
  <div id="player" data-project-id="{{ project.id }}" class="player-shell">
    <main id="playerStage" class="player-stage" tabindex="-1"></main>
    <section id="externalLayer" class="player-external-layer" aria-label="外部网页" hidden inert>
      <iframe
        id="externalFrame"
        class="player-external-frame"
        title="外部网页"
        referrerpolicy="no-referrer"
        sandbox="allow-downloads allow-forms allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
      ></iframe>
      <div id="externalStatus" class="player-external-status" role="status" aria-live="polite" hidden></div>
      <div class="player-external-return-dock">
        <button id="externalReturnBtn" class="player-external-return" type="button" aria-label="返回原型页面" title="返回原型页面">
          <span class="player-external-return-icon" aria-hidden="true">←</span>
          <span class="player-external-return-copy">
            <strong>返回</strong>
          </span>
        </button>
      </div>
    </section>
    <div id="playerMenuLayer" class="player-menu-layer" aria-hidden="true" inert>
      <div id="playerMenuBackdrop" class="player-menu-backdrop" aria-hidden="true"></div>
      <aside class="player-menu" role="dialog" aria-modal="true" aria-labelledby="playerMenuTitle">
        <header class="player-menu-header">
          <div class="player-menu-title">
            <strong id="playerMenuTitle">{{ project.name }}</strong>
            <span id="playerPageName"></span>
          </div>
          <button id="menuCloseBtn" class="player-menu-close" type="button" aria-label="关闭菜单">×</button>
        </header>
        <div class="player-menu-actions">
          <button id="backBtn" class="ghost-btn" type="button">← 返回</button>
          <button id="fullscreenBtn" class="ghost-btn" type="button" aria-pressed="false">进入全屏</button>
          <a href="/project/{{ project.id }}" class="ghost-btn">退出预览</a>
          <a href="/logout" class="ghost-btn">退出登录</a>
        </div>
        <nav class="player-nav" aria-label="页面导航">
          <div class="player-nav-heading">全部页面 <span id="playerPageCount" class="count-pill">0</span></div>
          <div class="page-search player-page-search">
            <input id="playerPageSearchInput" type="search" autocomplete="off" placeholder="按名称搜索页面" aria-label="按名称搜索页面" />
            <button id="playerPageSearchClear" type="button" aria-label="清空页面搜索" title="清空" hidden>×</button>
          </div>
          <div id="playerPageList" class="player-page-list"></div>
        </nav>
        <div class="player-menu-footer"><kbd>ESC</kbd><span>关闭菜单</span></div>
      </aside>
    </div>
  </div>
  <script src="/static/frame-fit.js?v=20260828-fullscreen-overlay"></script>
  <script src="/static/player-navigation.js?v=20260828-page-transition"></script>
  <script src="/static/page-list.js?v=20260831-page-management"></script>
  <script src="/static/player.js?v=20260831-external-link"></script>
  <script src="/static/player-media.js?v=20260906-video-pages"></script>
</body>
</html>
